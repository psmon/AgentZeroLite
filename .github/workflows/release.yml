name: Build & Release

# The official release: the Avalonia host (Project/AgentZeroAvalonia) — Windows, and macOS when
# the signing secrets are present.
# Up to v0.25.3 this workflow shipped the WPF host; WPF is now the reference build and has
# its own on-demand workflow (release-wpf.yml) that attaches to an existing release.
#
#   windows  → AgentZeroLite-v<ver>-Setup.exe (Inno Setup, installer/AgentZeroLite.iss)
#              AgentZeroLite-v<ver>-win-x64.zip  (portable)
#              both include the wearable host (wearable\) — the Microsoft Store edition does not
#   macos    → AgentZeroLite-v<ver>-osx-arm64.pkg — Developer ID signed + notarized, attached to the
#              release — when the MACOS_DEVID_* / ASC_* secrets exist (Docs/avalonia-v2/macos-distribution.md);
#              without them only an ad-hoc .app zip as a workflow artifact
#   linux    → AgentZeroLite-v<ver>-linux-x64.deb (Ubuntu/Debian, apt resolves WebKitGTK/GTK)
#              AgentZeroLite-v<ver>-linux-x64.tar.gz (portable) — linux/build-deb.sh; the job
#              installs its own .deb and runs it before uploading
#   release  → one GitHub release with the two Windows files (+ the macOS .pkg, + the Linux
#              .deb/.tar.gz), marked Latest; a failed macos or linux job does not hold back Windows
#
# A manual run with publish=false builds and uploads the files as workflow artifacts only —
# the way to check the installer before tagging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without the leading v, e.g. 0.25.4). Manual runs only; a tag push uses the tag. Empty = version.txt.'
        required: false
        default: ''
      publish:
        description: 'Create the GitHub release (false = build artifacts only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          ref="${{ github.ref }}"
          if [[ "$ref" == refs/tags/v* ]]; then
            ver="${ref#refs/tags/v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            ver="${{ github.event.inputs.version }}"
          else
            ver="$(tr -d '[:space:]' < Project/version.txt)"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$ver tag=v$ver"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # Both hosts read their version from this one file; stamp the release's version into it
      # (in the runner only) so the binary, the installer and the tag agree.
      - name: Stamp version
        shell: pwsh
        run: Set-Content -NoNewline Project/version.txt '${{ needs.version.outputs.version }}'

      - name: Publish Avalonia (self-contained, win-x64, with the wearable host)
        run: dotnet publish Project/AgentZeroAvalonia/AgentZeroAvalonia.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o ./publish

      - name: Check the published build
        shell: pwsh
        run: |
          ./publish/AgentZeroLite.exe -cli version
          ./publish/AgentZeroLite.exe -cli selftest all
          if (-not (Test-Path ./publish/wearable/AgentZeroWearable.exe)) { throw "wearable host missing from the publish" }

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath "./AgentZeroLite-${{ needs.version.outputs.tag }}-win-x64.zip"

      # Inno Setup writes to ./output. Move the installer next to the ZIP: an artifact keeps
      # paths relative to the files' common folder, so with one file in ./output it came back
      # as dist/output/… and the release step (which names dist/…) silently skipped it —
      # v0.25.4 was first published with the ZIP only.
      - name: Create installer (Inno Setup)
        shell: pwsh
        run: |
          iscc /DAppVersion="${{ needs.version.outputs.version }}" installer/AgentZeroLite.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Move-Item "./output/AgentZeroLite-${{ needs.version.outputs.tag }}-Setup.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ./AgentZeroLite-${{ needs.version.outputs.tag }}-win-x64.zip
            ./AgentZeroLite-${{ needs.version.outputs.tag }}-Setup.exe
          if-no-files-found: error

  macos:
    needs: version
    # macos-14 was retired (2026-11): v0.26.9's macos job was cancelled before a step ran.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
      - name: Stamp version
        run: printf '%s' '${{ needs.version.outputs.version }}' > Project/version.txt
      - name: Publish osx-arm64
        run: dotnet publish Project/AgentZeroAvalonia/AgentZeroAvalonia.csproj -c Release -r osx-arm64 --self-contained true -p:UseAppHost=true -o publish-avalonia/osx-arm64
      - name: Check the published build (no display)
        run: |
          chmod +x publish-avalonia/osx-arm64/AgentZeroLite publish-avalonia/osx-arm64/AgentZeroLite.sh
          publish-avalonia/osx-arm64/AgentZeroLite -cli version
          publish-avalonia/osx-arm64/AgentZeroLite -cli selftest all
      # Developer ID signing + notarization run only when the secrets are there (a fork, or a repo
      # without them, still gets the ad-hoc .app). Same identities and scripts as the local flow in
      # Docs/avalonia-v2/macos-distribution.md: a throwaway keychain holds the two .p12 files, and
      # its partition list lets codesign/productbuild use the keys without a prompt.
      - name: Import Developer ID identities
        id: sign
        env:
          APP_P12: ${{ secrets.MACOS_DEVID_APP_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_DEVID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          if [ -z "$APP_P12" ] || [ -z "$INSTALLER_P12" ]; then
            echo "no signing secrets - ad-hoc build"; echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          kc="$RUNNER_TEMP/agentzero-signing.keychain-db"
          kcpw="$(openssl rand -base64 24)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          printf '%s' "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/installer.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          app_id="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          pkg_id="$(security find-identity -v -p basic "$kc" | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -1)"
          [ -n "$app_id" ] && [ -n "$pkg_id" ] || { echo "identities not found"; security find-identity -v "$kc"; exit 1; }
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
          echo "pkg_id=$pkg_id" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "signing as: $app_id / $pkg_id"
      - name: Bundle .app and zip
        env:
          SIGN_ID: ${{ steps.sign.outputs.app_id }}
        run: |
          v='${{ needs.version.outputs.version }}'
          sh Project/AgentZeroAvalonia/macos/build-app.sh publish-avalonia/osx-arm64 publish-avalonia/AgentZeroLite.app "$v"
          publish-avalonia/AgentZeroLite.app/Contents/MacOS/AgentZeroLite.sh version
          cd publish-avalonia && ditto -c -k --keepParent AgentZeroLite.app "AgentZeroLite-v$v-osx-arm64.zip"
      - name: Installer package, notarized
        if: steps.sign.outputs.enabled == 'true'
        env:
          PKG_SIGN_ID: ${{ steps.sign.outputs.pkg_id }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          v='${{ needs.version.outputs.version }}'
          pkg="publish-avalonia/AgentZeroLite-v$v-osx-arm64.pkg"
          sh Project/AgentZeroAvalonia/macos/build-pkg.sh publish-avalonia/AgentZeroLite.app "$pkg" "$v"
          export NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$NOTARY_KEY"
          sh Project/AgentZeroAvalonia/macos/notarize.sh "$pkg"
          rm -f "$NOTARY_KEY"
      - name: Remove the signing keychain
        if: always() && steps.sign.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/agentzero-signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            publish-avalonia/AgentZeroLite-${{ needs.version.outputs.tag }}-osx-arm64.zip
            publish-avalonia/AgentZeroLite-${{ needs.version.outputs.tag }}-osx-arm64.pkg
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
      - name: Stamp version
        run: printf '%s' '${{ needs.version.outputs.version }}' > Project/version.txt
      - name: Publish linux-x64
        run: dotnet publish Project/AgentZeroAvalonia/AgentZeroAvalonia.csproj -c Release -r linux-x64 --self-contained true -p:UseAppHost=true -o publish-avalonia/linux-x64
      - name: Check the published build (no display)
        run: |
          chmod +x publish-avalonia/linux-x64/AgentZeroLite publish-avalonia/linux-x64/AgentZeroLite.sh
          publish-avalonia/linux-x64/AgentZeroLite -cli version
          publish-avalonia/linux-x64/AgentZeroLite -cli selftest all
      - name: Package .deb + tar.gz
        run: bash Project/AgentZeroAvalonia/linux/build-deb.sh publish-avalonia/linux-x64 publish-avalonia/dist '${{ needs.version.outputs.version }}'
      # Installed as a user would: apt resolves the Depends, then the command runs.
      - name: Install the .deb and run it
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./publish-avalonia/dist/*.deb desktop-file-utils
          desktop-file-validate /usr/share/applications/agentzerolite.desktop
          agentzerolite -cli version
          agentzerolite -cli selftest all
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            publish-avalonia/dist/AgentZeroLite-${{ needs.version.outputs.tag }}-linux-x64.deb
            publish-avalonia/dist/AgentZeroLite-${{ needs.version.outputs.tag }}-linux-x64.tar.gz
          if-no-files-found: error

  # Waits for macOS and Linux too, but only Windows has to succeed: a notarization hiccup or a
  # Linux packaging failure must not hold back the Windows release. Their files are attached
  # when their jobs produced them.
  release:
    needs: [version, windows, macos, linux]
    if: always() && needs.windows.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: macOS package (when notarized)
        id: mac
        run: |
          pkg="dist/AgentZeroLite-${{ needs.version.outputs.tag }}-osx-arm64.pkg"
          if [ -f "$pkg" ]; then
            echo "file=$pkg" >> "$GITHUB_OUTPUT"
            echo "row=| \`$(basename "$pkg")\` | macOS 12+ on Apple Silicon — signed (Developer ID) and notarized installer; installs **AgentZero Lite.app** into /Applications. |" >> "$GITHUB_OUTPUT"
          else
            echo "row=" >> "$GITHUB_OUTPUT"
          fi
      - name: Linux packages (when built)
        id: linux
        run: |
          deb="dist/AgentZeroLite-${{ needs.version.outputs.tag }}-linux-x64.deb"
          tgz="dist/AgentZeroLite-${{ needs.version.outputs.tag }}-linux-x64.tar.gz"
          if [ -f "$deb" ] && [ -f "$tgz" ]; then
            echo "deb=$deb" >> "$GITHUB_OUTPUT"
            echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
            echo "row_deb=| \`$(basename "$deb")\` | Ubuntu 22.04+ / Debian 12 x64 (desktop), test build — easiest: \`curl -fsSL https://psmon.github.io/AgentZeroLite/Home/install-linux.sh \\| bash\`. By hand: copy the .deb to /tmp, then \`sudo apt install /tmp/$(basename "$deb")\` (from ~/Downloads apt prints a harmless '_apt … Permission denied' notice). Installs WebKitGTK/GTK 3 with it and adds **AgentZero Lite** to the app menu. |" >> "$GITHUB_OUTPUT"
            echo "row_tgz=| \`$(basename "$tgz")\` | Linux x64 portable — extract and run \`AgentZeroLite\`; needs the same system libraries as the .deb. |" >> "$GITHUB_OUTPUT"
          else
            echo "row_deb=" >> "$GITHUB_OUTPUT"; echo "row_tgz=" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: AgentZero Lite ${{ needs.version.outputs.tag }}
          files: |
            dist/AgentZeroLite-${{ needs.version.outputs.tag }}-Setup.exe
            dist/AgentZeroLite-${{ needs.version.outputs.tag }}-win-x64.zip
            ${{ steps.mac.outputs.file }}
            ${{ steps.linux.outputs.deb }}
            ${{ steps.linux.outputs.tgz }}
          body: |
            **AgentZero Lite** — the official build is now the cross-platform (Avalonia) host, released for Windows.

            | File | For |
            |---|---|
            | `AgentZeroLite-${{ needs.version.outputs.tag }}-Setup.exe` | Windows 10/11 x64 installer (recommended). Includes the **wearable** host. Upgrades an earlier install in place; your workspaces and settings are kept. |
            | `AgentZeroLite-${{ needs.version.outputs.tag }}-win-x64.zip` | Windows portable — unzip and run. Includes the wearable host. |
            ${{ steps.mac.outputs.row }}
            ${{ steps.linux.outputs.row_deb }}
            ${{ steps.linux.outputs.row_tgz }}

            Also on the **Microsoft Store** (automatic updates, no wearable): https://apps.microsoft.com/detail/9NRHDFMD38H7

            The WPF host is kept as a reference build — build it from source, or ask for a WPF installer on a release.
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: 'true'
          draft: false
          prerelease: false
